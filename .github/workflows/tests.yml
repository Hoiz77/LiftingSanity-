# Every push and pull request runs the test suite: all of it in Chromium, and the first-launch-to-restore journey
# in WebKit (Safari's engine, with an iPhone's user agent). Same commands as on a computer: see tests/README.md.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromium:
    name: All tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  webkit:
    name: First launch to restored backup (WebKit, iPhone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - run: node tests/journey.test.js
        env:
          LS_BROWSER: webkit
