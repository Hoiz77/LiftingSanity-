<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lifting Sanity</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Log every set, follow your split and watch your lifts go up. Works offline on iPad.">
<meta name="theme-color" content="#101215">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lifting Sanity">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: a tab rail on the left (a bottom bar on phones) beside one working column.
   The live workout is a two-pane logbook: exercise list on the left, the set sheet on the right. */
:root {
  --bg: #101215; --panel: #171a1f; --panel-2: #1f232a; --panel-3: #292e37;
  --line: #2a2f37; --line-2: #3a404b; --grid: #262a31;
  --ink: #eceef2; --ink-2: #b0b7c3; --muted: #7f8794;
  --accent: #5b93ff; --on-accent: #06132e; --accent-soft: rgba(91, 147, 255, .14);
  --good: #3ccb8c; --on-good: #04170e; --good-soft: rgba(60, 203, 140, .13);
  --warn: #f2c230; --bad: #f2555a; --bad-soft: rgba(242, 85, 90, .13);
  --steel: #9aa3ae; --plate-red: #e5383b; --plate-blue: #2d6cdf; --plate-yellow: #f2c230; --plate-green: #2fa36b; --plate-white: #eceff2;
  --scrim: rgba(4, 6, 10, .62); --shadow: 0 12px 36px rgba(0, 0, 0, .5);
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", system-ui, sans-serif;
  --ui: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabbar: 62px; --rail: 92px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f2f3f5; --panel: #ffffff; --panel-2: #f1f3f6; --panel-3: #e3e7ec;
    --line: #e1e4e9; --line-2: #cdd2da; --grid: #eceef1;
    --ink: #14171c; --ink-2: #474e59; --muted: #6a717c;
    --accent: #1f5fdb; --on-accent: #ffffff; --accent-soft: rgba(31, 95, 219, .1);
    --good: #0f8f57; --on-good: #ffffff; --good-soft: rgba(15, 143, 87, .11);
    --warn: #b98900; --bad: #d4282e; --bad-soft: rgba(212, 40, 46, .09);
    --steel: #8c96a2; --plate-white: #f7f8fa;
    --scrim: rgba(20, 24, 32, .4); --shadow: 0 12px 36px rgba(20, 24, 32, .16);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f2f3f5; --panel: #ffffff; --panel-2: #f1f3f6; --panel-3: #e3e7ec;
  --line: #e1e4e9; --line-2: #cdd2da; --grid: #eceef1;
  --ink: #14171c; --ink-2: #474e59; --muted: #6a717c;
  --accent: #1f5fdb; --on-accent: #ffffff; --accent-soft: rgba(31, 95, 219, .1);
  --good: #0f8f57; --on-good: #ffffff; --good-soft: rgba(15, 143, 87, .11);
  --warn: #b98900; --bad: #d4282e; --bad-soft: rgba(212, 40, 46, .09);
  --steel: #8c96a2; --plate-white: #f7f8fa;
  --scrim: rgba(20, 24, 32, .4); --shadow: 0 12px 36px rgba(20, 24, 32, .16);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--ui); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 45; background: var(--bg); }
body.wo-open { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; text-align: inherit; }
button:disabled { cursor: default; }
input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: 46px; }
h2 { font-size: 27px; }
h3 { font-size: 22px; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.i.thick { stroke-width: 3.4; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 12px/1.3 var(--ui); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.eyebrow.accent { color: var(--accent); }
.link { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- shell ---------- */
#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex;
  height: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-top: 1px solid var(--line);
}
.brand { display: none; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font: 600 11px/1 var(--ui); letter-spacing: .02em; }
.tab .i { width: 24px; height: 24px; }
.tab.on { color: var(--accent); }
#view {
  max-width: 1000px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(22px + env(safe-area-inset-top, 0px)) calc(var(--tabbar) + 48px + env(safe-area-inset-bottom, 0px));
}
body.has-mini #view { padding-bottom: calc(var(--tabbar) + 120px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 760px) {
  #tabs { top: 0; right: auto; width: calc(var(--rail) + env(safe-area-inset-left, 0px)); height: auto; flex-direction: column; gap: 6px; border-top: 0; border-right: 1px solid var(--line); padding: calc(18px + env(safe-area-inset-top, 0px)) 10px 18px max(10px, env(safe-area-inset-left, 0px)); }
  .brand { display: grid; place-items: center; height: 54px; margin-bottom: 10px; }
  .mark { width: 40px; height: 40px; }
  .tab { flex: 0 0 auto; min-height: 68px; border-radius: 14px; font-size: 12px; }
  .tab.on { background: var(--accent-soft); }
  #view {
    margin-left: calc(var(--rail) + env(safe-area-inset-left, 0px)); max-width: none;
    padding-left: max(32px, calc((100vw - var(--rail) - 1000px) / 2)); padding-right: max(32px, env(safe-area-inset-right, 0px), calc((100vw - var(--rail) - 1000px) / 2));
    padding-block: calc(34px + env(safe-area-inset-top, 0px)) 120px;
  }
  body.has-mini #view { padding-bottom: 160px; }
}

/* ---------- common pieces ---------- */
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 22px; }
.page-h > div { display: grid; gap: 4px; }
.page-h-side { color: var(--ink-2); }
.page-h-side b { font: 700 24px var(--display); color: var(--ink); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
.pad { padding: 18px; }
.section { margin-top: 32px; }
.section-h { font-size: 28px; margin: 28px 0 8px; }
.section > .section-h { margin-top: 0; }
.section-sub { margin: -2px 0 14px; max-width: 62ch; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: var(--accent-soft); border: 1px solid var(--line); margin-bottom: 16px; }
.notice > .i { color: var(--accent); margin-top: 1px; }
.notice p { flex: 1; color: var(--ink-2); }
.notice b { color: var(--ink); }
.notice.bad { background: var(--bad-soft); }
.notice .icon-btn { margin: -10px -8px -10px 0; }
.pill { display: inline-flex; align-items: center; gap: 5px; min-height: 26px; padding: 0 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); font: 600 13px var(--ui); color: var(--ink-2); white-space: nowrap; }
.pill .i { width: 14px; height: 14px; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.quiet { background: transparent; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line-2); font: 600 16px var(--ui); white-space: nowrap; transition: transform .08s ease, background .15s; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn .i { width: 19px; height: 19px; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.big { min-height: 60px; font-size: 19px; border-radius: 14px; width: 100%; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.danger { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.btn.danger.ghost { background: transparent; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .42; }
.btn-pair { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--ink-2); flex-shrink: 0; }
.icon-btn:hover:not(:disabled) { background: var(--panel-2); }
.icon-btn:disabled { opacity: .3; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 13px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); font: 600 14px var(--ui); color: var(--ink-2); white-space: nowrap; flex-shrink: 0; }
.chip .i { width: 16px; height: 16px; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { min-height: 38px; padding: 0 14px; border-radius: 9px; font: 600 15px var(--ui); color: var(--ink-2); }
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.seg.sm button { min-height: 32px; padding: 0 10px; font-size: 13px; }
.switch { position: relative; width: 52px; height: 32px; border-radius: 999px; background: var(--panel-3); border: 1px solid var(--line-2); flex-shrink: 0; transition: background .15s; }
.switch span { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transition: transform .18s ease; }
.switch.on { background: var(--good); border-color: transparent; }
.switch.on span { transform: translateX(20px); }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > span { font: 600 13px var(--ui); color: var(--ink-2); }
.field input, .field textarea, .field select, .confirm textarea {
  width: 100%; min-height: 48px; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line-2);
  border-radius: 12px; padding: 10px 14px; font: 500 17px var(--ui);
}
.field textarea, .confirm textarea { resize: vertical; min-height: 84px; line-height: 1.4; }
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
.select-wrap { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; }
.select-wrap select { min-height: 44px; background: var(--panel); color: var(--ink); border: 1px solid var(--line-2); border-radius: 12px; padding: 0 12px; font: 600 16px var(--ui); max-width: 100%; }
.select-wrap.sm select { min-height: 38px; background: var(--panel-2); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row-btns { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; }
.row-btns.left { justify-content: flex-start; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 14px 0; }
.tile { background: var(--panel-2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 1px; align-content: start; }
.tile > span { font: 600 12px/1.3 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tile b { font: 700 28px/1.1 var(--display); }
.tile small { color: var(--muted); font-size: 13px; }
.tiles.four .tile { background: var(--panel); border: 1px solid var(--line); }
.list-card { overflow: hidden; }
.set-item { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.set-item:last-child { border-bottom: 0; }
.set-item > div:first-child { flex: 1 1 220px; min-width: 0; }
.set-item p { margin-top: 2px; font-size: 14px; }
.prose ol { margin: 0 0 10px; padding-left: 22px; display: grid; gap: 6px; }

/* ---------- train ---------- */
.card.resume { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; margin-bottom: 16px; border-color: var(--good); }
.card.resume > span:nth-child(2) { flex: 1; display: grid; }
.card.resume small { color: var(--muted); }
.live-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 4px var(--good-soft); flex-shrink: 0; animation: pulse 1.6s ease-in-out infinite; }
.split { padding: 20px; display: grid; gap: 14px; }
.split-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.split-h h2 { font-size: 30px; margin-top: 2px; }
.split-actions { display: flex; gap: 8px; }
.upnext { background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 10px; }
.upnext h3 { font-size: 44px; }
.ex-preview { list-style: none; padding: 0; margin: 2px 0 4px; display: grid; }
.ex-preview li { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.ex-preview li:last-child { border-bottom: 0; }
.ex-preview li > span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.ex-preview.big li { padding: 11px 0; }
.ex-preview.big b { font-weight: 600; font-size: 16px; }
.ex-preview.big small { display: block; color: var(--muted); font-size: 13px; }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.day { display: grid; gap: 2px; align-content: start; padding: 12px 14px; min-height: 80px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
.day b { font: 700 21px/1.1 var(--display); }
.day .muted { font-size: 13px; }
.day-n { font: 600 11px var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.day.is-next { border-color: var(--accent); }
.day.is-next .day-n { color: var(--accent); }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 0; }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin: 8px 0 16px; }
.tpl-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
.tpl-main { display: grid; gap: 3px; text-align: left; }
.tpl-main b { font: 700 22px/1.1 var(--display); }
.tpl-main .muted { font-size: 14px; }
.tpl-ex { font-size: 13px; color: var(--ink-2); }
.tpl-btns { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.block-old { flex-direction: row; align-items: center; text-align: left; }
.block-old .tpl-main { flex: 1; }
.chev { color: var(--muted); width: 18px; height: 18px; }
.prog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.prog { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 14px; }
.prog h3 { margin: 3px 0 5px; font-size: 24px; }
.prog .muted { font-size: 14px; }
.prog-days { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.prog-days span { font: 600 12px var(--ui); padding: 4px 8px; border-radius: 6px; background: var(--panel-2); color: var(--ink-2); }

/* ---------- mini bar, toast, rest timer ---------- */
#mini { position: fixed; z-index: 35; left: 12px; right: 12px; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 10px); max-width: 620px; margin: 0 auto; }
.mini-btn { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 0 16px; border-radius: 16px; background: var(--panel-3); border: 1px solid var(--line-2); box-shadow: var(--shadow); text-align: left; }
.mini-name { font: 700 20px/1.1 var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mini-meta { color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini-go { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 700; white-space: nowrap; }
.mini-go .i { width: 18px; height: 18px; }
#toast { position: fixed; z-index: 95; left: 50%; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 18px); transform: translate(-50%, 16px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 16px; max-width: calc(100vw - 32px); width: max-content; padding: 12px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 500; box-shadow: var(--shadow); transition: opacity .18s, transform .18s; }
#toast.in { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#toast button { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; min-height: 32px; }
body.has-mini #toast { bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 84px); }
body.wo-open #toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); }
body.resting #toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 126px); }
body.resting:not(.wo-open) #toast { bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 122px); }
#restbar { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(640px, calc(100% - 24px)); background: var(--panel-3); border: 1px solid var(--line-2); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
body:not(.wo-open) #restbar { bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 10px); }
body.has-mini:not(.wo-open) #restbar { bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 76px); }
.rb-track { height: 4px; background: var(--line); }
.rb-fill { height: 100%; background: var(--accent); transform-origin: left; transition: transform .25s linear; }
.rb-main { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; }
.rb-txt { flex: 1; min-width: 0; display: grid; }
.rb-label { font: 600 11px var(--ui); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.rb-time { font: 700 36px/1 var(--display); font-variant-numeric: tabular-nums; }
.rb-next { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rb-btns { display: flex; gap: 6px; }
.rb-btns button { min-height: 46px; min-width: 50px; padding: 0 10px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); font: 700 16px var(--ui); display: grid; place-items: center; }
.rb-btns .skip { background: var(--accent); color: var(--on-accent); border-color: transparent; padding: 0 16px; }
#restbar.soon .rb-fill { background: var(--warn); }
#restbar.over { border-color: var(--good); animation: flash .9s ease-in-out 3; }
#restbar.over .rb-time, #restbar.over .rb-label { color: var(--good); }
@media (min-width: 760px) {
  #mini { left: calc(var(--rail) + 24px); right: 24px; bottom: 18px; }
  #toast, body.has-mini #toast { bottom: 28px; left: calc(50% + var(--rail) / 2); }
  body.has-mini #toast { bottom: 96px; }
  body:not(.wo-open) #restbar { bottom: 18px; left: calc(50% + var(--rail) / 2); width: min(640px, calc(100% - var(--rail) - 48px)); }
  body.has-mini:not(.wo-open) #restbar { bottom: 88px; }
  body.resting:not(.wo-open) #toast { bottom: 130px; }
