<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lifting Sanity</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Log every set, follow your split and watch your lifts go up. Works offline on iPad and iPhone.">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lifting Sanity">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&display=swap" media="print" data-font>
<style>
/* Layout: a tab rail on the left on iPad (a bottom bar on iPhone) beside one working column.
   The live workout is a logbook: exercises down the left, the set sheet on the right.
   Look: black like the gym floor, iOS-familiar surfaces, set markers drawn as small weight plates,
   and a wide athletic face (Archivo, stretched) for titles and big numbers. */
:root {
  --bg: #000000; --panel: #121214; --panel-2: #1c1c1f; --panel-3: #2a2a2f;
  --line: #222226; --line-2: #36363c; --grid: #1f1f23; --seg-on: #3a3a41;
  --ink: #f5f5f7; --ink-2: #ababb3; --muted: #75757d;
  --accent: #0a84ff; --on-accent: #ffffff; --accent-soft: rgba(10, 132, 255, .17);
  --good: #30d158; --on-good: #00230d; --good-soft: rgba(48, 209, 88, .14);
  --warn: #ffd60a; --bad: #ff453a; --bad-soft: rgba(255, 69, 58, .15);
  --side-l: #32d74b; --side-r: #bf5af2;
  --p-b: #8e8e93; --p-d: #5e5ce6; --p-a: #ff9f0a; --p-rp: #ff375f; --p-m: #66d4cf; --p-c: #a3d65c; --p-p: #ac8e68; --p-e: #64d2ff;
  --steel: #9aa0a8; --plate-red: #ff453a; --plate-blue: #0a84ff; --plate-yellow: #ffd60a; --plate-green: #30d158; --plate-white: #f2f2f7;
  --term-bg: #050506; --term-ink: #4cd964;
  --bar-bg: rgba(14, 14, 16, .78); --scrim: rgba(0, 0, 0, .62); --shadow: 0 18px 44px rgba(0, 0, 0, .6);
  --display: "Archivo", "Arial Black", "Helvetica Neue", system-ui, sans-serif;
  --ui: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --tabbar: 62px; --rail: 92px; --status-band: #000000;
  --hi: inset 0 1px 0 rgba(255, 255, 255, .06); --glow: 0 12px 30px -10px rgba(10, 132, 255, .75);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f2f2f7; --panel: #ffffff; --panel-2: #f2f2f7; --panel-3: #e5e5ea;
    --line: #e5e5ea; --line-2: #d1d1d6; --grid: #ececf0; --seg-on: #ffffff;
    --ink: #111114; --ink-2: #4a4a52; --muted: #6e6e76;
    --accent: #007aff; --on-accent: #ffffff; --accent-soft: rgba(0, 122, 255, .1);
    --good: #1f9d47; --on-good: #ffffff; --good-soft: rgba(52, 199, 89, .14);
    --warn: #c79a00; --bad: #e0352b; --bad-soft: rgba(255, 59, 48, .1);
    --side-l: #1e9e45; --side-r: #9f45d8;
    --p-m: #12a39b; --p-c: #6a9a1f; --p-e: #0a9fd0; --p-a: #e08600;
    --term-bg: #ffffff; --term-ink: #2f9e44;
    --bar-bg: rgba(249, 249, 251, .82); --scrim: rgba(0, 0, 0, .32); --shadow: 0 18px 44px rgba(0, 0, 0, .14);
    --status-band: #f2f2f7;
    --hi: 0 1px 2px rgba(0, 0, 0, .05), 0 6px 18px -10px rgba(0, 0, 0, .12); --glow: 0 12px 26px -12px rgba(0, 122, 255, .7);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f2f2f7; --panel: #ffffff; --panel-2: #f2f2f7; --panel-3: #e5e5ea;
  --line: #e5e5ea; --line-2: #d1d1d6; --grid: #ececf0; --seg-on: #ffffff;
  --ink: #111114; --ink-2: #4a4a52; --muted: #6e6e76;
  --accent: #007aff; --on-accent: #ffffff; --accent-soft: rgba(0, 122, 255, .1);
  --good: #1f9d47; --on-good: #ffffff; --good-soft: rgba(52, 199, 89, .14);
  --warn: #c79a00; --bad: #e0352b; --bad-soft: rgba(255, 59, 48, .1);
  --side-l: #1e9e45; --side-r: #9f45d8;
  --p-m: #12a39b; --p-c: #6a9a1f; --p-e: #0a9fd0; --p-a: #e08600;
  --term-bg: #ffffff; --term-ink: #2f9e44;
  --bar-bg: rgba(249, 249, 251, .82); --scrim: rgba(0, 0, 0, .32); --shadow: 0 18px 44px rgba(0, 0, 0, .14);
  --status-band: #f2f2f7;
  --hi: 0 1px 2px rgba(0, 0, 0, .05), 0 6px 18px -10px rgba(0, 0, 0, .12); --glow: 0 12px 26px -12px rgba(0, 122, 255, .7);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--ui); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 100; background: var(--status-band); pointer-events: none; }
body.wo-open { overflow: hidden; }
/* while a workout is open it covers everything: the screens underneath needn't be painted */
body.wo-open #view, body.wo-open #tabs, body.wo-open #mini { visibility: hidden; }
/* an app, not a page: long-press shouldn't select text or pop up the copy menu */
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, select, [contenteditable] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; text-align: inherit; }
button:disabled { cursor: default; }
input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--display); font-weight: 800; font-stretch: 112%; line-height: 1.02; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 40px; }
h2 { font-size: 24px; }
h3 { font-size: 20px; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.i.thick { stroke-width: 3.4; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 12px/1.3 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.eyebrow.accent { color: var(--accent); }
.eyebrow.good { color: var(--good); display: inline-flex; align-items: center; gap: 6px; }
.eyebrow .i { width: 15px; height: 15px; }
.link { color: var(--accent); font-weight: 600; }

/* exercise pictures: a light tile in both themes, like a printed exercise card */
.thumb { --fig: #dde2e8; --fig-m: #c6ccd5; --hit: #ff3b30; --hit-2: #ffa29c; display: grid; place-items: center; flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; background: #f4f5f7; overflow: hidden; }
.thumb svg { width: 100%; height: 100%; display: block; }
.thumb.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.art { position: relative; background: #d7f0fc; }
/* Everkinetic line drawings: white paper becomes the tile colour */
.ek img { mix-blend-mode: multiply; }
.thumb.art.ek img { transform: scale(1.05); object-fit: contain; }
.thumb.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.18); transform-origin: 50% 56%; }
/* start and finish shown in turn, like a two-frame animation */
.moving img.f1 { animation: frame 2.4s steps(1) infinite; }
.moving img.f0 { animation: frame 2.4s steps(1) infinite reverse; }
@keyframes frame { 0% { opacity: 0; } 50% { opacity: 1; } }
.thumb.xs { width: 28px; height: 28px; border-radius: 8px; }
.thumb.sm { width: 40px; height: 40px; border-radius: 10px; }
.thumb.md { width: 48px; height: 48px; }
.thumb.lg { width: 64px; height: 64px; border-radius: 16px; }

/* ---------- shell ---------- */
#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex;
  height: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px));
  background: var(--bar-bg); -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
  border-top: 1px solid var(--line);
}
.brand { display: none; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font: 600 10.5px/1 var(--ui); }
.tab .i { width: 24px; height: 24px; padding: 4px 16px; box-sizing: content-box; border-radius: 999px; transition: background .2s; }
.tab.on { color: var(--accent); }
.tab.on .i { background: var(--accent-soft); }
#view {
  max-width: 1000px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(var(--tabbar) + 48px + env(safe-area-inset-bottom, 0px));
}
body.has-mini #view { padding-bottom: calc(var(--tabbar) + 120px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 760px) {
  #tabs { top: 0; right: auto; width: calc(var(--rail) + env(safe-area-inset-left, 0px)); height: auto; flex-direction: column; gap: 6px; border-top: 0; border-right: 1px solid var(--line); padding: calc(18px + env(safe-area-inset-top, 0px)) 10px 18px max(10px, env(safe-area-inset-left, 0px)); }
  .brand { display: grid; place-items: center; height: 54px; margin-bottom: 10px; }
  .mark { width: 40px; height: 40px; }
  .tab { flex: 0 0 auto; min-height: 66px; border-radius: 16px; font-size: 11.5px; }
  .tab.on { background: var(--accent-soft); }
  .tab .i, .tab.on .i { padding: 0; background: none; }
  #view {
    margin-left: calc(var(--rail) + env(safe-area-inset-left, 0px)); max-width: none;
    padding-left: max(32px, calc((100vw - var(--rail) - 1000px) / 2)); padding-right: max(32px, env(safe-area-inset-right, 0px), calc((100vw - var(--rail) - 1000px) / 2));
    padding-block: calc(34px + env(safe-area-inset-top, 0px)) 120px;
  }
  body.has-mini #view { padding-bottom: 160px; }
}

/* ---------- common pieces ---------- */
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 20px; }
.page-h > div { display: grid; gap: 4px; }
.page-h-side { color: var(--ink-2); display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.page-h-side b { font: 800 22px var(--display); font-stretch: 112%; color: var(--ink); }
.streak { display: inline-flex; align-items: center; gap: 5px; min-height: 34px; padding: 0 12px 0 10px; border-radius: 999px; background: rgba(255, 159, 10, .15); color: var(--p-a); font-weight: 600; font-size: 14px; }
.streak .i { width: 17px; height: 17px; }
.page-h-side .streak b { font-size: 18px; color: inherit; }
.sess b { font-size: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--hi); }
.pad { padding: 18px; }
.section { margin-top: 30px; }
.section-h { font-size: 24px; margin: 28px 0 10px; }
.section > .section-h { margin-top: 0; }
.section-sub { margin: -4px 0 14px; max-width: 62ch; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 18px; background: var(--accent-soft); margin-bottom: 16px; }
.notice > .i { color: var(--accent); margin-top: 1px; }
.notice p { flex: 1; color: var(--ink-2); }
.notice b { color: var(--ink); }
.notice.bad { background: var(--bad-soft); }
.notice .icon-btn { margin: -10px -8px -10px 0; }
.pill { display: inline-flex; align-items: center; gap: 5px; min-height: 26px; padding: 0 10px; border-radius: 999px; background: var(--panel-2); font: 600 13px var(--ui); color: var(--ink-2); white-space: nowrap; }
.pill .i { width: 14px; height: 14px; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.quiet { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 46px; padding: 0 18px; border-radius: 999px; background: var(--panel-2); border: 0; font: 600 16px var(--ui); white-space: nowrap; transition: transform .08s ease, background .15s, opacity .15s; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn .i { width: 19px; height: 19px; }
.btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--glow); }
.btn.big { min-height: 58px; font-size: 18px; font-weight: 700; width: 100%; }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: 14px; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { color: var(--bad); background: var(--bad-soft); }
.btn.danger.ghost { background: transparent; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .38; }
.btn-pair { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; color: var(--ink-2); flex-shrink: 0; }
.icon-btn:hover:not(:disabled) { background: var(--panel-2); }
.icon-btn:disabled { opacity: .3; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 13px; border-radius: 999px; background: var(--panel-2); font: 600 14px var(--ui); color: var(--ink-2); white-space: nowrap; flex-shrink: 0; }
.chip .i { width: 16px; height: 16px; }
.chip.on { background: var(--accent-soft); color: var(--accent); }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--panel-3); border-radius: 11px; padding: 2px; gap: 2px; }
.seg button { min-height: 34px; padding: 0 14px; border-radius: 9px; font: 600 14px var(--ui); color: var(--ink-2); }
.seg button.on { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
.seg.sm button { min-height: 30px; padding: 0 10px; font-size: 13px; }
.switch { position: relative; width: 51px; height: 31px; border-radius: 999px; background: var(--panel-3); flex-shrink: 0; transition: background .18s; }
.switch span { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, .3); transition: transform .2s ease; }
.switch.on { background: var(--good); }
.switch.on span { transform: translateX(20px); }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > span { font: 600 13px var(--ui); color: var(--ink-2); }
.field input, .field textarea, .field select, .confirm textarea {
  width: 100%; min-height: 48px; background: var(--panel-2); color: var(--ink); border: 1px solid transparent;
  border-radius: 14px; padding: 10px 14px; font: 500 17px var(--ui);
}
.field textarea, .confirm textarea { resize: vertical; min-height: 84px; line-height: 1.4; }
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
.select-wrap { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; }
.select-wrap select { min-height: 44px; background: var(--panel); color: var(--ink); border: 1px solid var(--line-2); border-radius: 12px; padding: 0 12px; font: 600 16px var(--ui); max-width: 100%; }
.select-wrap.sm select { min-height: 38px; background: var(--panel-2); border-color: transparent; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row-btns { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; }
.row-btns.left { justify-content: flex-start; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 14px 0; }
.tile { background: var(--panel-2); border-radius: 18px; padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.tile > span { font: 600 11px/1.3 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tile b { font: 800 26px/1.1 var(--display); font-stretch: 108%; }
.tile small { color: var(--muted); font-size: 13px; }
.tiles.four .tile { background: var(--panel); border: 1px solid var(--line); }
.list-card { overflow: hidden; }
.set-item { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.set-item:last-child { border-bottom: 0; }
.set-item > div:first-child { flex: 1 1 220px; min-width: 0; }
.set-item p { margin-top: 2px; font-size: 14px; }
.prose ol { margin: 0 0 10px; padding-left: 22px; display: grid; gap: 6px; }

/* ---------- train ---------- */
.week { display: flex; align-items: center; justify-content: space-between; gap: 10px 18px; flex-wrap: wrap; padding: 12px 14px; margin-bottom: 22px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--hi); }
.week-days { display: flex; gap: 6px; flex: 1 1 280px; justify-content: space-between; max-width: 360px; }
.wd { display: grid; justify-items: center; gap: 5px; min-width: 34px; }
.wd small { font: 600 11px var(--ui); color: var(--muted); text-transform: uppercase; }
.wd b { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 600 14px var(--ui); background: var(--panel-2); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.wd.on b { background: var(--accent); color: var(--on-accent); box-shadow: var(--glow); }
.wd.on b .i { width: 16px; height: 16px; }
.wd.today small { color: var(--accent); }
.wd.today b { box-shadow: inset 0 0 0 2px var(--accent); color: var(--ink); }
.wd.today.on b { box-shadow: var(--glow); }
.wd.later b { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-2); }
.week-sum { color: var(--ink-2); font-size: 14px; }
.week-sum b { color: var(--ink); }
.card.resume { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; margin-bottom: 16px; background: var(--good-soft); border-color: transparent; }
.card.resume > span:nth-child(2) { flex: 1; display: grid; }
.card.resume small { color: var(--ink-2); }
.live-dot { position: relative; width: 10px; height: 10px; border-radius: 50%; background: var(--good); flex-shrink: 0; }
.live-dot::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; background: var(--good); opacity: .25; animation: pulse 1.6s ease-in-out infinite; }
.split { display: grid; gap: 14px; }
.split-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding: 0 2px; }
.split-h h2 { font-size: 28px; margin-top: 3px; }
.split-actions { display: flex; gap: 8px; }
.split-actions .btn { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.upnext { position: relative; overflow: hidden; border-radius: 28px; display: grid; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--hi); }
.upnext-b { position: relative; display: grid; gap: 12px; padding: 18px 18px 20px; background: radial-gradient(120% 80% at 100% 0%, var(--accent-soft), transparent 60%); }
.upnext h3 { font-size: 48px; }
.upnext.resting .upnext-b { background: radial-gradient(120% 80% at 100% 0%, var(--good-soft), transparent 60%); }
.upnext.resting h3 { color: var(--ink-2); }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; height: 118px; background: #d7f0fc; }
.strip .thumb { width: 100%; height: 100%; border-radius: 0; }
.strip .thumb.art img { transform: scale(1.3); transform-origin: 50% 52%; }
.upnext.resting .strip { filter: saturate(.35) brightness(.85); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); font-size: 14px; }
.facts span { display: inline-flex; align-items: center; gap: 6px; }
.facts .i { width: 16px; height: 16px; color: var(--muted); }
.ex-preview { list-style: none; padding: 0; margin: 2px 0 0; display: grid; }
.ex-preview li { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.ex-preview li:last-child { border-bottom: 0; }

  font: 800 15px/1 var(--display); font-stretch: 104%; color: var(--pc); background: transparent; box-shadow: inset 0 0 0 2.5px var(--pc); transition: background .2s, color .2s; }

.badge[data-tag]::after { content: attr(data-tag); position: absolute; right: -6px; top: -6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--tc); color: var(--tt); box-shadow: 0 0 0 2px var(--row-bg, var(--panel)); font: 800 10px/17px var(--ui); text-align: center; }

/* one row for both sides: a ring half green, half purple; reps boxes underlined in each side's colour */
.badge.lr { box-shadow: none; --pc: var(--accent); }
.badge.lr::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--side-r) 0 180deg, var(--side-l) 180deg 360deg); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); }
.badge.lr { color: var(--ink); }
.set-row.done .badge.lr { background: conic-gradient(var(--side-r) 0 180deg, var(--side-l) 180deg 360deg); color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .35); }
.set-row.done .badge.lr::before { display: none; }
.cell.side-L { box-shadow: inset 0 -3px 0 var(--side-l); }
.cell.side-R { box-shadow: inset 0 -3px 0 var(--side-r); }
.set-row.part .check { box-shadow: inset 0 0 0 2px var(--good); color: var(--good); }
.cell.span2 { grid-column: span 2; }
.set-row.head .hs-L { color: var(--side-l); }
.set-row.head .hs-R { color: var(--side-r); }
.check.del { background: var(--bad); color: #fff; }
.check.del .i { width: 21px; height: 21px; stroke-width: 2.2; }
.sets.deleting .set-row:not(.head) { animation: wiggle .5s ease 1; }
.del-btn.on { background: var(--bad) !important; color: #fff !important; }
.del-hint { background: var(--bad-soft); }
.del-hint .i { color: var(--bad); }

/* one-side sets: the left and right rows sit together in one block with a two-colour edge */
.pair { position: relative; display: grid; gap: 4px; padding: 4px; border-radius: 20px; --row-bg: color-mix(in srgb, var(--panel-2) 70%, var(--panel)); background: var(--row-bg); }
.pair::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: linear-gradient(var(--side-l) 0 50%, var(--side-r) 50% 100%); }
.pair.r-first::before { background: linear-gradient(var(--side-r) 0 50%, var(--side-l) 50% 100%); }
.pair .set-row { padding-left: 4px; }
.pair.done { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--good) 45%, transparent); }

.prev { min-width: 0; display: grid; gap: 2px; justify-items: start; padding: 0 2px; }
.prev .last { max-width: 100%; color: var(--ink-2); font: 500 14px var(--ui); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; min-height: 22px; }
.prev .last i { font-style: normal; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-right: 5px; }
.prev .last.archived { color: var(--muted); font-style: italic; }
.prev .same + .last { font-size: 12px; color: var(--muted); }
.prev .same { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; min-height: 28px; padding: 0 10px 0 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font: 600 13px var(--ui); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.prev .same span { overflow: hidden; text-overflow: ellipsis; }
.prev .same .i { width: 15px; height: 15px; stroke-width: 2.6; }
.prev .none { color: var(--muted); }
.cell { height: 44px; width: 100%; min-width: 0; text-align: center; font: 600 19px var(--ui); font-variant-numeric: tabular-nums; background: var(--panel-2); color: var(--ink); border: 1.5px solid transparent; border-radius: 13px; padding: 0 4px; -webkit-appearance: none; appearance: none; }
.pair .cell { background: var(--panel); }
.cell::placeholder { color: var(--muted); font-weight: 500; opacity: 1; }
.cell:focus { outline: none; border-color: var(--accent); }
.set-row.done .cell { background: transparent; }
.cell.eff { font-size: 17px; }
.cell.eff .ph { color: var(--muted); font-weight: 500; }
.check { width: 46px; height: 44px; border-radius: 14px; display: grid; place-items: center; justify-self: end; background: var(--panel-2); color: var(--muted); }
.pair .check { background: var(--panel); }
.check .i { width: 24px; height: 24px; stroke-width: 3; }
.set-row.done .check { background: var(--good); color: var(--on-good); }
.pr-row { display: flex; gap: 6px; align-items: center; color: var(--good); font: 600 13px var(--ui); padding: 0 8px 2px 56px; }
.pr-row .i { width: 15px; height: 15px; }
.eff-pick { display: grid; gap: 8px; padding: 10px; margin: 0 4px; background: var(--panel-2); border-radius: 16px; }
.eff-q { font-size: 13px; color: var(--ink-2); }
.eff-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.eff-chips button { min-width: 50px; min-height: 44px; padding: 0 10px; border-radius: 999px; background: var(--panel-3); font: 700 18px var(--ui); font-variant-numeric: tabular-nums; }
.eff-chips button.on { background: var(--accent); color: var(--on-accent); }
.eff-chips button.clear { font-size: 14px; font-weight: 600; color: var(--ink-2); background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }
.exc-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.set-ctl { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--panel-2); }
.set-ctl .btn { min-height: 40px; background: transparent; }
.set-ctl .btn.add { color: var(--accent); }
.set-ctl .del-btn { color: var(--bad); }
.exc-nav { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.exc-nav .btn { min-height: 56px; }
.exc-nav .next { justify-content: space-between; font-size: 17px; min-width: 0; padding: 0 22px; }
.exc-nav .next span { overflow: hidden; text-overflow: ellipsis; }
.exc-nav .btn:not(.primary) { background: var(--panel-2); }

/* ---------- sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .22s; }
.sheet { position: relative; width: 100%; max-width: 640px; max-height: calc(100% - 28px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; background: var(--panel); border-radius: 28px 28px 0 0; box-shadow: var(--shadow); padding-bottom: env(safe-area-inset-bottom, 0px); transform: translateY(100%); transition: transform .26s cubic-bezier(.2, .8, .2, 1); }
.sheet::before { content: ""; position: absolute; top: 7px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: var(--line-2); }
.sheet-wrap.in .sheet { transform: none; }
.sheet-wrap.in .sheet-backdrop { opacity: 1; }
.sheet-wrap.small .sheet { max-width: 540px; }
.sheet-wrap.wide .sheet { max-width: 780px; }
.sheet-wrap.full .sheet { max-width: 940px; height: calc(100% - 20px - env(safe-area-inset-top, 0px)); }
@media (min-width: 760px) {
  .sheet-wrap { align-items: center; padding: 28px; }
  .sheet { border-radius: 28px; padding-bottom: 0; max-height: min(880px, 100%); transform: translateY(18px) scale(.985); opacity: 0; transition: transform .22s cubic-bezier(.2, .8, .2, 1), opacity .18s; }
  .sheet::before { display: none; }
  .sheet-wrap.in .sheet { opacity: 1; }
  .sheet-wrap.full .sheet { height: min(900px, 100%); }
}
.sheet-h { display: grid; grid-template-columns: minmax(70px, 1fr) auto minmax(70px, 1fr); align-items: center; gap: 8px; padding: 16px 12px 10px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.sheet-h > :first-child { justify-self: start; }
.sheet-h h2 { font: 700 17px var(--ui); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.sheet-h-r { justify-self: end; display: flex; gap: 8px; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet-body.pad { padding: 18px 20px 28px; }
.sheet-body.menu { padding: 8px; }
.menu-item { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 54px; padding: 10px 12px; border-radius: 14px; text-align: left; }
.menu-item > .i { color: var(--ink-2); }
.menu-item:hover { background: var(--panel-2); }
.menu-item b { font-weight: 600; }
.menu-item small { display: block; color: var(--muted); font-size: 13px; line-height: 1.35; }
.menu-item.on { background: var(--accent-soft); }
.menu-item.danger, .menu-item.danger > .i { color: var(--bad); }
.menu-item .tick { margin-left: auto; color: var(--accent); }
.menu-item .badge { flex-shrink: 0; }
.menu-sep { height: 1px; background: var(--line); margin: 6px 8px; }
.confirm h2 { margin-bottom: 10px; font-size: 24px; }
.confirm > p { color: var(--ink-2); line-height: 1.5; margin-bottom: 10px; }
.confirm > p b { color: var(--ink); }
.confirm .row-btns .btn { flex: 1 1 140px; }
.rest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.rest-grid button { min-height: 58px; border-radius: 18px; background: var(--panel-2); font: 800 21px var(--display); font-stretch: 108%; font-variant-numeric: tabular-nums; }
.rest-grid button.on { background: var(--accent); color: var(--on-accent); }
.big-title { font-size: 40px; margin: 6px 0 2px; }
.sub-h { display: flex; gap: 8px; align-items: center; font-size: 20px; margin: 24px 0 10px; }
.sub-h .i { color: var(--muted); }
.pr-list { list-style: none; padding: 0; margin: 0; }
.pr-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); }
.pr-list li span:nth-child(2) { color: var(--good); font-size: 14px; font-weight: 600; }
.msets { display: flex; flex-wrap: wrap; gap: 8px; }
.msets b { color: var(--ink); }
.note-text { color: var(--ink-2); padding: 12px 14px; background: var(--panel-2); border-radius: 14px; margin: 10px 0; white-space: pre-wrap; }
.wd-ex { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line); }
.wd-pic { flex-shrink: 0; border-radius: 16px; }
.wd-body { flex: 1; min-width: 0; }
.wd-name { font: 700 19px/1.15 var(--ui); text-align: left; }
.lines { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 4px; }
.lines li { display: flex; gap: 10px; align-items: center; font-size: 16px; flex-wrap: wrap; }
.lt { min-width: 26px; font: 800 17px/1.2 var(--display); font-stretch: 104%; }
.lt span { margin-left: 1px; }
.lt-N, .lt-T, .lt-B { color: var(--accent); }
.lt-W { color: var(--warn); }
.lt-L { color: var(--side-l); }
.lt-R { color: var(--side-r); }
.lt-D { color: var(--p-d); } .lt-F { color: var(--bad); } .lt-A { color: var(--p-a); } .lt-RP { color: var(--p-rp); }
.lt-M { color: var(--p-m); } .lt-C { color: var(--p-c); } .lt-P { color: var(--p-p); } .lt-E { color: var(--p-e); }

/* ---------- filters & exercise lists ---------- */
.filters { display: grid; gap: 10px; margin-bottom: 14px; }
.sheet-body .filters { position: sticky; top: 0; z-index: 2; background: var(--panel); padding: 12px 14px; margin: 0; border-bottom: 1px solid var(--line); }
.search { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 14px; background: var(--panel-2); color: var(--muted); border: 1.5px solid transparent; }
#view .search { background: var(--panel); border-color: var(--line); }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--ink); font: 500 17px var(--ui); -webkit-appearance: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chips.sub .chip { min-height: 30px; font-size: 13px; }
#view .chips .chip:not(.on) { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.ex-list { display: grid; }
.list-h { padding: 16px 16px 6px; }
.ex-row { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 66px; padding: 9px 16px; border-bottom: 1px solid var(--line); text-align: left; }
.ex-row:last-child { border-bottom: 0; }
.ex-row, .hist-card { content-visibility: auto; contain-intrinsic-size: auto 66px; }
.hist-card { contain-intrinsic-size: auto 150px; }
.ex-row.on { background: var(--accent-soft); }
.ex-row.create { color: var(--accent); }
.ex-row.create .i { width: 48px; }
.ex-txt { flex: 1; min-width: 0; display: grid; }
.ex-txt b { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ex-txt small { color: var(--muted); font-size: 13px; }
.tickbox { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line-2); display: grid; place-items: center; font: 700 13px var(--ui); flex-shrink: 0; }
.ex-row.on .tickbox { background: var(--accent); box-shadow: none; color: var(--on-accent); }
.btn.more { margin: 10px 0 4px; background: var(--panel-2); color: var(--accent); }
.ex-list.card .btn.more { width: calc(100% - 24px); margin: 10px 12px 12px; }
/* growth rating pill and the "best for growth" order */
.score { flex-shrink: 0; min-width: 30px; height: 26px; padding: 0 7px; border-radius: 999px; display: inline-grid; place-items: center; font: 800 14px/1 var(--display); font-stretch: 104%; font-variant-numeric: tabular-nums; background: var(--panel-3); color: var(--ink-2); }
.score.hi { background: var(--good); color: var(--on-good); }
.score.good { background: var(--good-soft); color: var(--good); }
.score.ok { background: var(--accent-soft); color: var(--accent); }
.filter-row { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; }
.filter-row .seg button { display: inline-flex; align-items: center; gap: 4px; }
.filter-note { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 10px; color: var(--ink-2); }

/* ---------- history ---------- */
.cal { padding: 12px 14px 14px; margin-bottom: 18px; }
.cal-h { display: flex; align-items: center; justify-content: space-between; max-width: 460px; margin: 0 auto; }
.cal-h div { display: grid; text-align: center; }
.cal-h b { font: 800 19px var(--display); font-stretch: 108%; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 8px auto 0; max-width: 460px; }
.cal-w { text-align: center; font: 600 11px var(--ui); color: var(--muted); padding: 2px 0; }
.cal-d { display: grid; place-items: center; aspect-ratio: 1; border-radius: 50%; font: 600 15px var(--ui); color: var(--ink-2); font-variant-numeric: tabular-nums; cursor: default; }
.cal-d.has { background: var(--accent); color: var(--on-accent); cursor: pointer; }
.cal-d.today { box-shadow: inset 0 0 0 2px var(--ink-2); }
.cal-d.on { box-shadow: inset 0 0 0 3px var(--ink); }
.hist-list { display: grid; gap: 10px; }
.hist-card { width: 100%; text-align: left; display: grid; gap: 8px; padding: 14px 16px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--hi); }
.sheet .hist-card { background: var(--panel-2); border-color: transparent; }
.hist-top { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
.stack { display: inline-flex; padding-left: 10px; }
.stack .thumb { margin-left: -10px; box-shadow: 0 0 0 2.5px var(--panel); }
.sheet .stack .thumb { box-shadow: 0 0 0 2.5px var(--panel-2); }
.hist-n { font: 800 16px var(--display); font-stretch: 108%; color: var(--muted); font-variant-numeric: tabular-nums; }
.hist-top b { font: 800 20px/1.1 var(--display); font-stretch: 108%; }
.hist-date { margin-left: auto; font-size: 14px; }
.hist-stats { display: flex; gap: 6px 16px; flex-wrap: wrap; color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; }
.hist-ex { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-2); font-size: 14px; }
.block-div { display: flex; align-items: baseline; gap: 8px; margin: 14px 2px 0; font: 800 17px var(--display); font-stretch: 108%; }
.block-div .i { width: 18px; height: 18px; color: var(--muted); align-self: center; }
.block-div small { font: 500 13px var(--ui); color: var(--muted); }

/* ---------- progress & charts ---------- */
.block-card { padding: 18px; display: grid; gap: 12px; margin-bottom: 4px; }
.block-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.block-top > div:first-child { display: grid; gap: 4px; }
.block-top h2 { font-size: 30px; }
.link-h { display: inline-flex; align-items: center; gap: 8px; font: inherit; }
.link-h .i { width: 17px; height: 17px; color: var(--muted); }
.block-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.chart-card { padding: 16px; margin-top: 14px; --chart-ring: var(--panel); }
.sheet .chart-card { background: var(--panel-2); border-color: transparent; --chart-ring: var(--panel-2); }
.chart-top { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 10px; }
.chart-top h3 { font-size: 19px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; overflow: visible; touch-action: pan-y; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { fill: var(--muted); font: 500 11px var(--ui); font-variant-numeric: tabular-nums; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .line.dim { stroke: var(--muted); opacity: .55; }
.chart .dot-dim { fill: var(--muted); opacity: .55; }
.chart .area { fill: var(--accent); opacity: .1; }
.chart .end-dot, .chart .focus-dot { fill: var(--accent); stroke: var(--chart-ring); stroke-width: 2; }
.chart .end-label { fill: var(--ink); font: 700 13px var(--ui); font-variant-numeric: tabular-nums; }
.chart .xhair { stroke: var(--ink-2); stroke-width: 1; }
.chart .mark-line { stroke: var(--line-2); stroke-width: 1; }
.chart .mark-label { fill: var(--ink-2); }
.chart .bar { fill: var(--accent); opacity: .45; }
.chart .bar.cur { opacity: 1; }
.chart .tip { position: absolute; z-index: 3; pointer-events: none; display: grid; gap: 1px; white-space: nowrap; padding: 7px 11px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 13px; box-shadow: var(--shadow); }
.chart .tip b { font-size: 15px; font-variant-numeric: tabular-nums; }
.chart-empty { height: 100%; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 0 20px; }
.mbars { display: grid; gap: 9px; }
.mbar { display: grid; grid-template-columns: 104px minmax(0, 1fr) 40px; gap: 10px; align-items: center; font-size: 14px; }
.mbar-t { position: relative; height: 16px; border-radius: 8px; background: var(--panel-2); overflow: hidden; }
.mbar-t .band { position: absolute; top: 0; bottom: 0; background: var(--good-soft); }
.mbar-t .fill { position: absolute; left: 0; top: 3px; bottom: 3px; background: var(--accent); border-radius: 0 6px 6px 0; }
.mbar-v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.chart-card > p.small { margin-top: 10px; }
.lift, .pr-item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 14px; align-items: center; width: 100%; padding: 12px 16px; border-bottom: 1px solid var(--line); text-align: left; }
.lift:last-child, .pr-item:last-child { border-bottom: 0; }
.lift-n, .pr-item > span:nth-child(2) { display: grid; min-width: 0; }
.lift-n b, .pr-item b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lift-n small, .pr-item small { color: var(--muted); font-size: 13px; }
.lift-v { display: grid; text-align: right; font-variant-numeric: tabular-nums; }
.lift-v small { font-size: 13px; color: var(--muted); }
.lift-v small.up { color: var(--good); font-weight: 600; }
.pr-item { grid-template-columns: auto minmax(0, 1fr) auto; }
.pr-item > .i { color: var(--good); }
.spark path { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linejoin: round; }
.spark circle { fill: var(--accent); }
.exd-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; }
.exd-tags .btn { margin-left: auto; }
.exd-hero { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
.exd-art { position: relative; margin: 0; flex: 1 1 100%; aspect-ratio: 4 / 3; border-radius: 24px; overflow: hidden; background: #d7f0fc; }
.exd-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.exd-art figcaption { position: absolute; left: 12px; bottom: 10px; font: 500 11px var(--ui); color: #3d5a6b; }
.exd-art figcaption a { color: inherit; }
.exd-step { position: absolute; right: 14px; bottom: 12px; display: flex; gap: 5px; }
.exd-step i { width: 18px; height: 5px; border-radius: 3px; background: #0a84ff; opacity: .25; animation: frame 2.4s steps(1) infinite reverse; }
